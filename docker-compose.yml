version: '3.8'

services:

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: 1977
      POSTGRES_DB: yalda
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - observe-network
    ports:
      - "5432:5432"

  postgres-exporter:
    build:
      context: ./postgres-exporter
    environment: 
      DATA_SOURCE_NAME: "postgres:1977@db:5432/yalda?sslmode=disable"
    networks:
      - observe-network
    ports:
      - "9187:9187"

  prometheus:
    build:
      context: ./prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - observe-network
    ports:
      - "9090:9090"

  grafana:
    build:
      context: ./grafana
    networks:
      - observe-network
    ports:
      - "3000:3000"

networks:
  observe-network:
    driver: bridge